<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp Challenge</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="container"
      class="d-flex flex-column align-items-center justify-content-center rounded"
    >
      <form class="w-100">
        <div class="m-3">
          <label for="email" class="form-label fs-4">Email</label>
          <input
            id="email"
            class="form-control border border-dark border-3 fs-5"
            type="email"
            placeholder="Example@gmail.com"
            aria-describedby="emailHelp"
          />
          <div id="emailError" class="form-text fs-5">
            Make sure email is more than 3 characters and has @ and a .
          </div>
        </div>
        <div class="m-3">
          <label for="password" class="form-label fs-4">Password</label>
          <input
            id="password"
            class="form-control border border-dark border-3 text-dark fs-5"
            type="password"
            placeholder="Your Password"
            aria-describedby="emailHelp"
          />
          <div id="passwordError" class="form-text fs-5">
            Make sure password is more than 8 characters.
          </div>
        </div>
        <div class="m-3">
          <p id="successMsg"></p>
        </div>
        <button
          type="submit"
          class="m-3 btn btn-white border border-dark border-3 rounded ps-4 pe-4 fs-4"
        >
          Submit
        </button>
      </form>
    </div>
  </body>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
